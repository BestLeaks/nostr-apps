name: Deploy Codeberg Pages

# Build the Zola directory site and publish it to Codeberg Pages.
# Canonical site: nostr-apps.zamrock.net (served via Cloudflare Worker proxy).
# Forks: deploys to <fork-owner>.codeberg.page/Nostr-Apps/.

on:
  push:
    branches: [main, master]
  pull_request: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-codeberg:
    runs-on: codeberg-small
    if: ${{ forge.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          mkdir -p /tmp/zola-bin
          curl -sL -o /tmp/zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.3/zola-v0.23.3-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp/zola-bin zola
          chmod +x /tmp/zola-bin/zola
          /tmp/zola-bin/zola --version

      - name: Build Zola site
        run: /tmp/zola-bin/zola build

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://ZamRock-Radio.codeberg.page/nostr-apps-deploy/
          token: ${{ forge.token }}
          source: public/